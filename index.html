<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(120deg, #ffe6eb, #fff);
        font-family: 'Segoe Script', cursive;
        overflow: hidden;
    }

    .container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
    }

    .text-box {
        font-size: 26px;
        color: #222;
        max-width: 900px;
    }

    .highlight {
        color: #c0392b;
        font-weight: bold;
    }

    .line {
        opacity: 0;
        border-right: 2px solid #c0392b;
        white-space: nowrap;
        overflow: hidden;
        margin: 15px 0;
    }

    /* Floating hearts */
    .heart {
        position: absolute;
        color: red;
        animation: float 8s infinite ease-in;
        opacity: 0.7;
    }

    @keyframes float {
        0% { transform: translateY(100vh) scale(1); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
</style>
</head>

<body>

<!-- 🎵 Romantic Music -->
<audio autoplay loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div class="text-box">
        <div class="line">Tum pehno agar <span class="highlight">payal</span> toh main le aaunga ❤️</div>
        <div class="line">Tum lagaao agar <span class="highlight">bindi</span> toh main le aaunga ❤️</div>

        <div class="line">Magar phir bhi agar tumhe <span class="highlight">chaand</span> dekhna ho,</div>
        <div class="line">toh main tumhare liye <span class="highlight">aaina</span> le aaunga ❤️</div>
    </div>
</div>

<script>
    /* Typewriter effect */
    const lines = document.querySelectorAll('.line');
    let delay = 0;

    lines.forEach((line) => {
        const text = line.innerHTML;
        line.innerHTML = "";
        setTimeout(() => {
            line.style.opacity = 1;
            let i = 0;
            const typing = setInterval(() => {
                line.innerHTML += text.charAt(i);
                i++;
                if (i === text.length) {
                    clearInterval(typing);
                    line.style.borderRight = "none";
                }
            }, 60);
        }, delay);
        delay += 2500;
    });

    /* Floating hearts */
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 12 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 8000);
    }
    setInterval(createHeart, 500);
</script>

</body>
</html>
